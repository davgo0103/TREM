name: TREM

# 手動執行：打包指定版本的 macOS 與 Linux 安裝檔，上傳到該版本的 Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（例如 v7.0.1）"
        required: true

permissions:
  contents: write

jobs:
  Linux_x64:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TREM.Electron
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install rpm
      run: sudo apt-get update && sudo apt-get install -y rpm
    - name: Restore dependencies
      run: npm ci
    - name: Build
      run: npx electron-builder --linux -p never
    - name: Upload to release
      run: gh release upload "${{ inputs.tag }}" dev/*.AppImage dev/*.deb dev/*.rpm dev/latest-linux.yml --clobber
      env:
        GH_TOKEN: ${{ github.token }}

  macOS:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: TREM.Electron
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag }}
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Restore dependencies
      run: npm ci
    # 沒有 Apple 開發者憑證，使用 ad-hoc 簽章（Apple 晶片至少要有 ad-hoc 簽章才能執行）
    - name: Build
      run: >
        npx electron-builder --mac dmg --x64 --arm64 -p never
        -c.mac.icon=TREM.icns -c.mac.identity=-
        '-c.artifactName=${productName}-${version}-mac-${arch}.${ext}'
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
    - name: Upload to release
      run: gh release upload "${{ inputs.tag }}" dev/*.dmg --clobber
      env:
        GH_TOKEN: ${{ github.token }}
